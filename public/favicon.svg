      <stop offset="0%" stop-color="#F7E294" />
      <stop offset="48%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B08722" />
    </linearGradient>
    <radialGradient id="mfBg" cx="50%" cy="35%" r="70%">
